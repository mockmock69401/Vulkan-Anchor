name: Build and release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: |
            17
            21
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assemble --no-daemon --console=plain --max-workers=2
      - name: Verify release and package corresponding source
        id: package
        run: |
          python3 .github/scripts/verify_release.py
          mc=$(sed -n 's/^minecraft_version[[:space:]]*=[[:space:]]*//p' gradle.properties)
          echo "minecraft=$mc" >> "$GITHUB_OUTPUT"
          git archive --format=zip HEAD -o "build/release/VulkanAnchor_${mc}-source.zip"
          cd build/release
          sha256sum *.jar *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: VulkanAnchor-${{ steps.package.outputs.minecraft }}
          path: build/release/
          if-no-files-found: error
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MC_VERSION: ${{ steps.package.outputs.minecraft }}
        run: |
          tag="shaded-mc-${MC_VERSION}-${GITHUB_SHA:0:7}"
          gh release create "$tag" build/release/*             --target "$GITHUB_SHA"             --title "Vulkan Anchor 0.1.0 - Minecraft ${MC_VERSION}"             --notes-file .github/release-notes.txt             --prerelease
